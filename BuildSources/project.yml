# Compile/link target settings are retained; private Swift/UI and icon assets are omitted.

name: ForgePlayNative
options:
  xcodeVersion: "26.0"
  bundleIdPrefix: com.forgeplay
  developmentLanguage: ko
  deploymentTarget:
    macOS: "26.0"
  createIntermediateGroups: true
  defaultConfig: Debug
configs:
  Debug: debug
  Release: release
  Distribution: release
  AppStore: release
settings:
  configFiles:
    Debug: Config/ForgePlayDefaults.xcconfig
    Release: Config/ForgePlayDefaults.xcconfig
    Distribution: Config/ForgePlayDefaults.xcconfig
    AppStore: Config/ForgePlayDefaults.xcconfig
  base:
    # Both native targets run inside the bundled x86_64 Wine process.
    ARCHS: x86_64
    MACOSX_DEPLOYMENT_TARGET: 26.0
    CLANG_ANALYZER_LOCALIZABILITY_NONLOCALIZED: YES
targets:
  D3DMetalFrameGenerationProxy:
    type: library.dynamic
    productName: ForgePlayD3DMetalFrameGenerationProxy
    platform: macOS
    deploymentTarget: "26.0"
    configFiles:
      Debug: Config/ForgePlayD3DMetalFrameGenerationProxy.xcconfig
      Release: Config/ForgePlayD3DMetalFrameGenerationProxy.xcconfig
      Distribution: Config/ForgePlayD3DMetalFrameGenerationProxy.xcconfig
      AppStore: Config/ForgePlayD3DMetalFrameGenerationProxy.xcconfig
    sources:
      - path: Native/D3DMetalFrameGenerationProxy/ForgePlayD3DMetalFrameGenerationProxy.m
      - path: Native/D3DMetalFrameGenerationProxy/ForgePlayD3DMetalFrameGenerationProxy.h
        headerVisibility: project
      - path: Native/D3DMetalFrameGenerationProxy/FrameGenerationStateMachine.c
      - path: Native/D3DMetalFrameGenerationProxy/FrameGenerationStateMachine.h
        headerVisibility: project
      - path: Native/D3DMetalFrameGenerationProxy/ForgePlayD3DMetalFrameGenerationProxy.exports
        buildPhase: none
      - path: Native/D3DMetalFrameGenerationProxy/WineD3DOpenGLFrameGeneration.inc
        buildPhase: none
    dependencies:
      - sdk: AppKit.framework
      - sdk: Metal.framework
      - sdk: QuartzCore.framework
      - sdk: OpenGL.framework
      - sdk: IOSurface.framework
  GameModeProcessHost:
    type: application
    platform: macOS
    deploymentTarget: "26.0"
    configFiles:
      Debug: Config/ForgePlayGameModeProcessHost.xcconfig
      Release: Config/ForgePlayGameModeProcessHostRelease.xcconfig
      Distribution: Config/ForgePlayGameModeProcessHostDistribution.xcconfig
      AppStore: Config/ForgePlayGameModeProcessHostAppStore.xcconfig
    sources:
      - path: Native/GameModeProcessHost/GameModeProcessHost.m
      - path: Native/GameModeProcessHost/GameModeRuntimeIdentity.m
      - path: Native/GameModeProcessHost/GameModeApplicationGroup.m
      - path: Native/GameModeProcessHost/GameModeInheritedExecution.m
      - path: Native/GameModeProcessHost/PrefixExecutionLease.m
    dependencies:
      - sdk: Foundation.framework
      - sdk: Security.framework
    preBuildScripts:
      - name: Bind Exact Game Mode Host Runtime Identity
        basedOnDependencyAnalysis: true
        inputFiles:
          - $(SRCROOT)/Native/GameModeProcessHost/Info.plist
          - $(SRCROOT)/Resources/Runners/ForgePlayRuntime/RuntimeManifest.json
          - $(SRCROOT)/Resources/Runners/ForgePlayRuntime/SOURCE-AVAILABILITY.md
        outputFiles:
          - $(DERIVED_FILE_DIR)/GameModeBuildIdentity.generated.h
          - $(DERIVED_FILE_DIR)/GameModeHostEmbeddedInfo.plist
        script: |
          "$SRCROOT/Scripts/prepare-game-mode-host-build-identity.sh"
