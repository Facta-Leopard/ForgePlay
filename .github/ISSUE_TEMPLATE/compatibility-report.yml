name: Compatibility report
description: Report a game that works, fails, or is still being tested with ForgePlay.
title: "[Compatibility] "
labels:
  - compatibility
body:
  - type: markdown
    attributes:
      value: |
        Thank you for helping build the ForgePlay compatibility database.
        Please review any log or support bundle before attaching it. Never share passwords, Steam Guard codes, payment information, Apple ID credentials, private keys, or unrelated personal files.

  - type: input
    id: game
    attributes:
      label: Game
      description: Include the exact title and store or Steam App ID when available.
      placeholder: Game title / Steam App ID
    validations:
      required: true

  - type: dropdown
    id: result
    attributes:
      label: Result
      options:
        - Playable
        - Playable with issues
        - Testing
        - Does not launch
        - Blocked by anti-cheat or another external requirement
    validations:
      required: true

  - type: input
    id: hardware
    attributes:
      label: Mac hardware
      description: Mac model, Apple silicon chip, and unified memory.
      placeholder: M4 Pro / 24GB
    validations:
      required: true

  - type: input
    id: macos_version
    attributes:
      label: macOS version
      description: Leave blank when the version is not available.
      placeholder: macOS Tahoe 26.5.2

  - type: input
    id: forgeplay_version
    attributes:
      label: ForgePlay version
      description: Release version or commit when known. This field is optional.
      placeholder: v1.1.0

  - type: input
    id: game_version
    attributes:
      label: Game version or build
      description: Game patch, version, or build ID when known. This field is optional.
      placeholder: Version / patch / build ID

  - type: textarea
    id: behavior
    attributes:
      label: What happened?
      description: Describe launch, gameplay, graphics, audio, input, performance, and any reproducible failure.
    validations:
      required: true

  - type: textarea
    id: notes
    attributes:
      label: Renderer, anti-cheat, and other notes
      description: Include the selected renderer, relevant settings, launcher behavior, or anti-cheat messages.

  - type: textarea
    id: diagnostics
    attributes:
      label: Reviewed diagnostics
      description: Drag in a reviewed and redacted ForgePlay support bundle or paste only the relevant non-sensitive excerpt.

  - type: checkboxes
    id: privacy
    attributes:
      label: Privacy check
      options:
        - label: I reviewed every attachment and removed secrets and unrelated personal information.
          required: true
