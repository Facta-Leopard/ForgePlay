name: Deploy ForgePlay Website

on:
  push:
    branches:
      - main
    paths:
      - ".github/workflows/deploy-pages.yml"
      - ".github/FUNDING.yml"
      - ".github/ISSUE_TEMPLATE/compatibility-report.yml"
      - "index.html"
      - "why.html"
      - "license.html"
      - "privacy.html"
      - "support.html"
      - "compatibility.html"
      - "updates.html"
      - "site.css"
      - "locale-bootstrap.js"
      - "site.js"
      - "compatibility.js"
      - "announcements.js"
      - "developer-apps.js"
      - "site-assets/**"
      - "site-data/**"
      - "LICENSE.md"
      - "LICENSES/**"
      - "Scripts/verify-static-site.sh"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Check out website files
        uses: actions/checkout@v6

      - name: Verify static website
        run: bash Scripts/verify-static-site.sh

      - name: Prepare Pages artifact
        run: |
          mkdir _site
          cp index.html why.html license.html privacy.html support.html compatibility.html updates.html _site/
          cp site.css locale-bootstrap.js site.js compatibility.js announcements.js developer-apps.js _site/
          cp LICENSE.md _site/
          cp -R LICENSES site-assets site-data _site/
          touch _site/.nojekyll

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: _site

      - name: Deploy GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
